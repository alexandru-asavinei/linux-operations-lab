name: Linux Operations Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Bash syntax and automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n scripts/system-report.sh
          bash -n tests/test-system-report.sh

      - name: Run automated tests
        run: bash tests/test-system-report.sh
